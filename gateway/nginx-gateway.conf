# =============================================================================
#  Single-port gateway for all apps  ->  exposes ONLY RunPod port 8000
# =============================================================================
#  podid-8000.proxy.runpod.net/aug-ocr/        -> 127.0.0.1:8100  (aug-ocr)
#  podid-8000.proxy.runpod.net/sale-sentiment/  -> 127.0.0.1:8024  (sales sentiment)
#  podid-8000.proxy.runpod.net/resume-matcher/ -> 127.0.0.1:8025  (resume matcher)
#  podid-8000.proxy.runpod.net/tone-analysis/  -> 127.0.0.1:8026  (tone analyzer)
#  podid-8000.proxy.runpod.net/chatbot/        -> 127.0.0.1:8048  (HR chatbot)
#  podid-8000.proxy.runpod.net/datacleaning/   -> 127.0.0.1:8084  (data cleaning)
#
#  This file is meant to be `include`d INSIDE the http { } block of
#  /etc/nginx/nginx.conf. apply.sh wires that up for you.
#
#  NOTE: aug-ocr must be moved off port 8000 (nginx needs it) to 8100.
#        apply.sh patches /workspace/app/supervisord.conf for that.
# =============================================================================

# Reusable proxy behaviour for a path-prefixed backend with an HTML frontend.
# $1-style args aren't supported in nginx; we repeat the block per app but keep
# the shared bits in this snippet (proxy headers live in snippets/nginx-proxy.conf,
# already shipped with the RunPod image).

server {
    listen 8000;
    server_name _;

    client_max_body_size 1024M;        # OCR / resume / CSV uploads
    proxy_read_timeout   600s;         # OCR + LLM calls can be slow
    proxy_send_timeout   600s;

    # Returns a real JSON 5xx instead of RunPod's readme.html-as-200, so the
    # frontends get a parseable error and can show "try again" cleanly.
    location @apierr {
        default_type application/json;
        return 502 '{"error":"backend temporarily unavailable, please retry"}';
    }

    # Landing page so the bare host isn't a 404.
    location = / {
        default_type text/html;
        return 200 '<!doctype html><meta charset=utf-8><title>Apps</title>
<h2>Available apps</h2><ul>
<li><a href="/aug-ocr/">/aug-ocr/</a></li>
<li><a href="/sale-sentiment/">/sale-sentiment/</a></li>
<li><a href="/resume-matcher/">/resume-matcher/</a></li>
<li><a href="/tone-analysis/">/tone-analysis/</a></li>
<li><a href="/chatbot/">/chatbot/</a></li>
<li><a href="/datacleaning/">/datacleaning/</a></li>
</ul>';
    }

    # ---- aug-ocr -----------------------------------------------------------
    location = /aug-ocr { return 302 /aug-ocr/; }
    location /aug-ocr/ {
        include snippets/nginx-proxy.conf;
        # The base image's snippet sets `error_page 502 =200 @502;` which serves
        # RunPod's readme.html *as HTTP 200*. JSON clients then choke with
        # "Unexpected token '<', "<html> ...". Override it: surface real errors.
        error_page 502 503 504 = @apierr;
        proxy_set_header X-Forwarded-Prefix /aug-ocr;
        proxy_set_header Accept-Encoding "";      # let sub_filter see plain text
        sub_filter_once off;
        sub_filter_types text/css application/javascript;
        sub_filter 'href="/'   'href="/aug-ocr/';
        sub_filter 'src="/'    'src="/aug-ocr/';
        sub_filter 'action="/' 'action="/aug-ocr/';
        sub_filter '"/static/' '"/aug-ocr/static/';
        sub_filter '"/api/'    '"/aug-ocr/api/';
        proxy_pass http://127.0.0.1:8100/;        # trailing / strips the prefix
    }

    # ---- sale-sentiment -----------------------------------------------------
    location = /sale-sentiment { return 302 /sale-sentiment/; }
    location /sale-sentiment/ {
        include snippets/nginx-proxy.conf;
        # The base image's snippet sets `error_page 502 =200 @502;` which serves
        # RunPod's readme.html *as HTTP 200*. JSON clients then choke with
        # "Unexpected token '<', "<html> ...". Override it: surface real errors.
        error_page 502 503 504 = @apierr;
        proxy_set_header X-Forwarded-Prefix /sale-sentiment;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/css application/javascript;
        sub_filter 'href="/'   'href="/sale-sentiment/';
        sub_filter 'src="/'    'src="/sale-sentiment/';
        sub_filter 'action="/' 'action="/sale-sentiment/';
        sub_filter '"/static/' '"/sale-sentiment/static/';
        sub_filter '"/api/'    '"/sale-sentiment/api/';
        proxy_pass http://127.0.0.1:8024/;
    }

    # ---- resume-matcher ----------------------------------------------------
    location = /resume-matcher { return 302 /resume-matcher/; }
    location /resume-matcher/ {
        include snippets/nginx-proxy.conf;
        # The base image's snippet sets `error_page 502 =200 @502;` which serves
        # RunPod's readme.html *as HTTP 200*. JSON clients then choke with
        # "Unexpected token '<', "<html> ...". Override it: surface real errors.
        error_page 502 503 504 = @apierr;
        proxy_set_header X-Forwarded-Prefix /resume-matcher;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/css application/javascript;
        sub_filter 'href="/'   'href="/resume-matcher/';
        sub_filter 'src="/'    'src="/resume-matcher/';
        sub_filter 'action="/' 'action="/resume-matcher/';
        sub_filter '"/static/' '"/resume-matcher/static/';
        sub_filter '"/api/'    '"/resume-matcher/api/';
        proxy_pass http://127.0.0.1:8025/;
    }

    # ---- tone-analysis -----------------------------------------------------
    location = /tone-analysis { return 302 /tone-analysis/; }
    location /tone-analysis/ {
        include snippets/nginx-proxy.conf;
        # The base image's snippet sets `error_page 502 =200 @502;` which serves
        # RunPod's readme.html *as HTTP 200*. JSON clients then choke with
        # "Unexpected token '<', "<html> ...". Override it: surface real errors.
        error_page 502 503 504 = @apierr;
        proxy_set_header X-Forwarded-Prefix /tone-analysis;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/css application/javascript;
        sub_filter 'href="/'   'href="/tone-analysis/';
        sub_filter 'src="/'    'src="/tone-analysis/';
        sub_filter 'action="/' 'action="/tone-analysis/';
        sub_filter '"/static/' '"/tone-analysis/static/';
        sub_filter '"/api/'    '"/tone-analysis/api/';
        proxy_pass http://127.0.0.1:8026/;
    }

    # ---- chatbot -----------------------------------------------------------
    location = /chatbot { return 302 /chatbot/; }
    location /chatbot/ {
        include snippets/nginx-proxy.conf;
        # The base image's snippet sets `error_page 502 =200 @502;` which serves
        # RunPod's readme.html *as HTTP 200*. JSON clients then choke with
        # "Unexpected token '<', "<html> ...". Override it: surface real errors.
        error_page 502 503 504 = @apierr;
        proxy_set_header X-Forwarded-Prefix /chatbot;
        proxy_set_header Accept-Encoding "";
        # Token-by-token SSE streaming (/chatbot/chat/stream): nginx must NOT
        # buffer or the browser's stream reader stalls/errors ("something went
        # wrong"). curl drains the buffer fine; a live browser does not.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        sub_filter_once off;
        sub_filter_types text/css application/javascript;
        sub_filter 'href="/'   'href="/chatbot/';
        sub_filter 'src="/'    'src="/chatbot/';
        sub_filter 'action="/' 'action="/chatbot/';
        sub_filter '"/static/' '"/chatbot/static/';
        sub_filter '"/api/'    '"/chatbot/api/';
        proxy_pass http://127.0.0.1:8048/;
    }

    # ---- datacleaning ------------------------------------------------------
    location = /datacleaning { return 302 /datacleaning/; }
    location /datacleaning/ {
        include snippets/nginx-proxy.conf;
        # The base image's snippet sets `error_page 502 =200 @502;` which serves
        # RunPod's readme.html *as HTTP 200*. JSON clients then choke with
        # "Unexpected token '<', "<html> ...". Override it: surface real errors.
        error_page 502 503 504 = @apierr;
        proxy_set_header X-Forwarded-Prefix /datacleaning;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/css application/javascript;
        sub_filter 'href="/'   'href="/datacleaning/';
        sub_filter 'src="/'    'src="/datacleaning/';
        sub_filter 'action="/' 'action="/datacleaning/';
        sub_filter '"/static/' '"/datacleaning/static/';
        sub_filter '"/api/'    '"/datacleaning/api/';
        proxy_pass http://127.0.0.1:8084/;
    }
}
