services:

  # ── PostgreSQL ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: augocr
      POSTGRES_USER: augocr
      POSTGRES_PASSWORD: augocr
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "augocr", "-d", "augocr"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Arize Phoenix (LLM Observability) ──────────────────────────────
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"    # Phoenix UI + OTLP HTTP collector
      - "4317:4317"    # OTLP gRPC collector
    environment:
      - PHOENIX_WORKING_DIR=/phoenix
    volumes:
      - phoenixdata:/phoenix
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6006/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  phoenixdata:
