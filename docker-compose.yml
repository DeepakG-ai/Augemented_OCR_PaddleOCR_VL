services:

  # ── PostgreSQL ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: augocr
      POSTGRES_USER: augocr
      POSTGRES_PASSWORD: augocr
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "augocr", "-d", "augocr" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MinIO (Object Storage) ──────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [ "CMD", "sh", "-c", "test -d /data" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "python", "-m", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000" ]
    environment:
      DATABASE_URL: postgresql://augocr:augocr@postgres:5432/augocr
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:4317
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app

  normalize-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "python", "-m", "backend.worker", "--stage", "normalize", "--name", "normalize-worker" ]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://augocr:augocr@postgres:5432/augocr
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:4317
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./:/app

  ocr-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "python", "-m", "backend.worker", "--stage", "ocr", "--name", "ocr-worker" ]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://augocr:augocr@postgres:5432/augocr
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:4317
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./:/app

  llm-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "python", "-m", "backend.worker", "--stage", "llm", "--name", "llm-worker" ]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://augocr:augocr@postgres:5432/augocr
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:4317
      LLM_URL: http://host.docker.internal:8001/v1/chat/completions
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app

  postprocess-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "python", "-m", "backend.worker", "--stage", "postprocess", "--name", "postprocess-worker" ]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://augocr:augocr@postgres:5432/augocr
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:4317
      LLM_URL: http://host.docker.internal:8001/v1/chat/completions
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app

  outbound-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "python", "-m", "backend.worker", "--stage", "outbound", "--name", "outbound-worker" ]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://augocr:augocr@postgres:5432/augocr
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:4317
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./:/app

  # ── Phoenix (Tracing UI) ──────────────────────────────────────────
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      - PHOENIX_WORKING_DIR=/phoenix
    volumes:
      - phoenixdata:/phoenix

  # ── pgAdmin (Database UI) ─────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@augocr.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmindata:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro

volumes:
  pgdata:
  phoenixdata:
  miniodata:
  pgadmindata:
