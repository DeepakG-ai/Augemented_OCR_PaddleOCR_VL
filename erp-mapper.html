<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Augmented OCR — ERP Mapper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0b0d;--bg2:#0f1117;--bg3:#141720;--bg4:#1a1f2e;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#e2e4ea;--text-mid:#9ba3b2;--text-dim:#555d6b;
  --blue:#3b82f6;--blue-dim:rgba(59,130,246,0.3);--blue-glow:rgba(59,130,246,0.15);
  --green:#22c55e;--green-dim:#16a34a;
  --amber:#f59e0b;--amber-dim:rgba(245,158,11,0.2);
  --red:#ef4444;--red-dim:rgba(239,68,68,0.2);
  --teal:#14b8a6;
  --mono:'JetBrains Mono',monospace;
  --display:'Inter',sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--mono);}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── HEADER ── */
#app-header{
  display:flex;align-items:center;gap:0;height:40px;
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:0 16px;user-select:none;position:relative;z-index:100;
  flex-shrink:0;
}
.hdr-brand{font-family:var(--mono);font-weight:700;font-size:11px;
  color:var(--blue);letter-spacing:0.12em;margin-right:24px;white-space:nowrap;}
.hdr-nav{display:flex;gap:2px;flex:1}
.hdr-tab{
  padding:0 14px;height:40px;display:flex;align-items:center;
  font-size:10px;font-weight:600;letter-spacing:0.1em;color:var(--text-dim);
  cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s;
  position:relative;
}
.hdr-tab:hover{color:var(--text-mid)}
.hdr-tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.hdr-tab.active::after{
  content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;
  background:var(--blue);box-shadow:0 0 8px var(--blue);
}
.hdr-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.hdr-btn{
  padding:4px 10px;border:1px solid var(--border2);border-radius:4px;
  background:transparent;color:var(--text-mid);font-size:9px;font-family:var(--mono);
  letter-spacing:0.08em;cursor:pointer;transition:all 0.15s;
}
.hdr-btn:hover{border-color:var(--blue);color:var(--blue);}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);
  box-shadow:0 0 6px var(--green);animation:pulse-dot 2s infinite;}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.5}}

/* ── MAIN LAYOUT ── */
#app-body{display:flex;height:calc(100vh - 40px - 36px);overflow:hidden;}

/* ── PANELS ── */
.panel{display:flex;flex-direction:column;height:100%;overflow:hidden;position:relative;}
#panel-source{width:300px;min-width:240px;border-right:1px solid var(--border);flex-shrink:0;}
#panel-canvas{flex:1;position:relative;overflow:hidden;background:var(--bg);}
#panel-target{width:300px;min-width:240px;border-left:1px solid var(--border);flex-shrink:0;}

.panel-header{
  padding:10px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg2);flex-shrink:0;
}
.panel-title{font-size:9px;font-weight:700;letter-spacing:0.15em;color:var(--text-dim);}
.panel-badge{font-size:8px;padding:2px 6px;border-radius:2px;background:var(--bg3);
  color:var(--text-dim);border:1px solid var(--border);}
.panel-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px;}

/* ── CANVAS GRID ── */
#panel-canvas::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(var(--border) 1px,transparent 1px),
    linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:32px 32px;pointer-events:none;opacity:0.4;
}
.canvas-label{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;color:var(--text-dim);font-size:10px;letter-spacing:0.1em;
  pointer-events:none;
}
.canvas-label span{display:block;font-size:22px;margin-bottom:8px;opacity:0.3;}

/* ── SVG OVERLAY ── */
#svg-overlay{
  position:fixed;top:0;left:0;width:100vw;height:100vh;
  pointer-events:none;z-index:50;overflow:visible;
}
#svg-overlay path.conn-hit{pointer-events:stroke;stroke:transparent;stroke-width:14;fill:none;cursor:pointer;}
#svg-overlay path.conn-line{pointer-events:none;fill:none;}
#svg-overlay path.conn-line.selected{filter:drop-shadow(0 0 4px var(--blue));}
#svg-overlay path.live-drag{pointer-events:none;fill:none;stroke:var(--blue);stroke-width:1.5;stroke-dasharray:6 4;opacity:0.7;}
@keyframes dashFlow{to{stroke-dashoffset:-24}}
@keyframes drawIn{from{stroke-dashoffset:var(--path-len)}to{stroke-dashoffset:0}}

/* ── JSON TREE ── */
.json-node{font-size:10px;line-height:1;margin:0;}
.json-row{
  display:flex;align-items:center;min-height:26px;
  padding:0 4px;border-radius:3px;cursor:default;
  position:relative;transition:background 0.1s;
}
.json-row:hover{background:var(--bg3);}
.json-toggle{
  width:14px;height:14px;display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);font-size:9px;cursor:pointer;flex-shrink:0;margin-right:2px;
  user-select:none;
}
.json-key{color:var(--blue);margin-right:4px;font-weight:600;}
.json-colon{color:var(--text-dim);margin-right:4px;}
.json-val-str{color:var(--green);}
.json-val-num{color:var(--amber);}
.json-val-null{color:var(--text-dim);font-style:italic;}
.json-type-badge{font-size:8px;padding:1px 4px;border-radius:2px;
  background:var(--bg3);color:var(--text-dim);border:1px solid var(--border);margin-left:4px;}
.json-children{padding-left:14px;}

/* PORT DOTS */
.port{
  width:8px;height:8px;border-radius:50%;
  background:var(--blue);cursor:crosshair;flex-shrink:0;
  position:relative;transition:box-shadow 0.15s,transform 0.15s;
  margin-left:auto;
}
.port.source-port{margin-left:6px;}
.port.target-port{margin-right:6px;background:var(--green);}
.port.target-port.mapped{background:var(--blue);}
.port:hover,.port.hovered{box-shadow:0 0 8px currentColor;transform:scale(1.3);}
.port.valid-target{background:var(--green);box-shadow:0 0 8px var(--green);animation:port-pulse 0.6s ease infinite alternate;}
.port.invalid-target{background:var(--red);box-shadow:0 0 8px var(--red);animation:port-shake 0.2s ease;}
@keyframes port-pulse{0%{box-shadow:0 0 4px var(--green)}100%{box-shadow:0 0 12px var(--green)}}
@keyframes port-shake{0%,100%{transform:scale(1.3)}25%{transform:scale(1.3) translateX(-3px)}75%{transform:scale(1.3) translateX(3px)}}
@keyframes pulse-unmapped{0%,100%{box-shadow:0 0 3px var(--green)}50%{box-shadow:0 0 8px var(--green)}}
.port.target-port:not(.mapped){animation:pulse-unmapped 2s ease infinite;}

/* ── ERP FIELDS ── */
.erp-section{margin-bottom:8px;}
.erp-section-header{
  display:flex;align-items:center;gap:6px;
  padding:6px 8px;cursor:pointer;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:4px;user-select:none;
  font-size:9px;font-weight:700;letter-spacing:0.12em;color:var(--text-mid);
  margin-bottom:4px;
}
.erp-section-header:hover{border-color:var(--border2);}
.erp-section-toggle{color:var(--text-dim);font-size:8px;transition:transform 0.15s;}
.erp-section-toggle.open{transform:rotate(90deg);}

.erp-field{
  display:flex;align-items:center;min-height:28px;
  padding:3px 6px 3px 0;border-radius:3px;
  border-left:2px solid transparent;transition:all 0.15s;
  cursor:default;position:relative;
}
.erp-field:hover{background:var(--bg3);}
.erp-field.mapped{background:rgba(59,130,246,0.06);border-left-color:var(--blue);}
.erp-field.selected{background:rgba(59,130,246,0.12);border-left-color:var(--blue);}
.erp-field-name{font-size:10px;font-weight:600;color:var(--text);margin:0 6px;flex:1;white-space:nowrap;}
.erp-field-key{font-size:8px;padding:1px 4px;border-radius:2px;
  background:var(--bg3);color:var(--text-dim);border:1px solid var(--border);
  white-space:nowrap;flex-shrink:0;}
.erp-field-mapped{
  font-size:8px;padding:1px 5px;border-radius:2px;margin-left:4px;
  background:rgba(59,130,246,0.15);color:var(--blue);border:1px solid var(--blue-dim);
  white-space:nowrap;flex-shrink:0;max-width:90px;overflow:hidden;text-overflow:ellipsis;
}
.erp-field-empty{font-size:8px;color:var(--text-dim);margin-left:4px;font-style:italic;}
.erp-field-hard{font-size:8px;padding:1px 5px;border-radius:2px;margin-left:4px;
  background:var(--amber-dim);color:var(--amber);border:1px solid rgba(245,158,11,0.3);}

/* ── BOTTOM BAR ── */
#bottom-bar{
  height:36px;display:flex;align-items:center;gap:8px;padding:0 14px;
  background:var(--bg2);border-top:1px solid var(--border);
  position:relative;z-index:60;flex-shrink:0;overflow:hidden;
}
#bottom-bar.flash-save{animation:flash-green 0.8s ease;}
@keyframes flash-green{0%,100%{border-top-color:var(--border)}50%{border-top-color:var(--green);box-shadow:0 -2px 8px var(--green-dim)}}
.bb-select{
  background:var(--bg3);border:1px solid var(--border2);color:var(--text-mid);
  font-family:var(--mono);font-size:9px;padding:4px 8px;border-radius:3px;cursor:pointer;
  outline:none;
}
.bb-btn{
  padding:5px 12px;border:1px solid var(--border2);border-radius:3px;
  background:transparent;color:var(--text-mid);font-family:var(--mono);font-size:9px;
  letter-spacing:0.08em;cursor:pointer;transition:all 0.15s;white-space:nowrap;
}
.bb-btn:hover{border-color:var(--blue);color:var(--blue);}
.bb-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
.bb-btn.primary:hover{background:#2563eb;}
.bb-btn.danger:hover{border-color:var(--red);color:var(--red);}
.bb-sep{width:1px;height:20px;background:var(--border);flex-shrink:0;}
.bb-right{margin-left:auto;display:flex;gap:8px;align-items:center;}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:48px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--bg3);border:1px solid var(--border2);border-radius:4px;
  padding:8px 16px;font-size:10px;color:var(--text);letter-spacing:0.08em;
  opacity:0;transition:all 0.25s;z-index:200;pointer-events:none;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── CONTEXT MENU ── */
#ctx-menu{
  position:fixed;z-index:150;min-width:180px;
  background:var(--bg3);border:1px solid var(--border2);border-radius:6px;
  padding:4px 0;box-shadow:0 8px 32px rgba(0,0,0,0.6);
  display:none;
}
#ctx-menu.show{display:block;}
.ctx-title{padding:6px 14px;font-size:9px;color:var(--text-dim);letter-spacing:0.08em;
  border-bottom:1px solid var(--border);}
.ctx-item{
  padding:7px 14px;font-size:10px;color:var(--text-mid);cursor:pointer;
  display:flex;align-items:center;gap:8px;transition:all 0.1s;
}
.ctx-item:hover{background:var(--bg4);color:var(--text);}
.ctx-item.danger:hover{color:var(--red);}
.ctx-sep{height:1px;background:var(--border);margin:3px 0;}
.ctx-sub{position:relative;}
.ctx-sub-menu{
  position:absolute;left:100%;top:0;min-width:160px;
  background:var(--bg3);border:1px solid var(--border2);border-radius:6px;
  padding:4px 0;box-shadow:0 8px 32px rgba(0,0,0,0.6);display:none;
}
.ctx-sub:hover .ctx-sub-menu{display:block;}
.ctx-input-row{padding:5px 14px;display:flex;gap:6px;}
.ctx-input{
  flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:3px;
  color:var(--text);font-family:var(--mono);font-size:9px;padding:4px 6px;outline:none;
}
.ctx-input:focus{border-color:var(--blue);}

/* ── MODAL ── */
#modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:160;
  display:none;align-items:center;justify-content:center;
}
#modal-overlay.show{display:flex;}
.modal{
  background:var(--bg2);border:1px solid var(--border2);border-radius:8px;
  width:680px;max-width:95vw;max-height:85vh;display:flex;flex-direction:column;
  box-shadow:0 24px 80px rgba(0,0,0,0.8);overflow:hidden;
}
.modal-header{
  padding:14px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.modal-title{font-size:10px;font-weight:700;letter-spacing:0.12em;color:var(--text-mid);}
.modal-close{
  background:transparent;border:1px solid var(--border);border-radius:3px;
  color:var(--text-dim);font-size:10px;cursor:pointer;padding:3px 8px;
  font-family:var(--mono);transition:all 0.15s;
}
.modal-close:hover{border-color:var(--red);color:var(--red);}
.modal-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
.modal-section-label{font-size:9px;font-weight:700;color:var(--text-dim);letter-spacing:0.12em;margin-bottom:6px;}
.modal-code{
  background:var(--bg);border:1px solid var(--border);border-radius:4px;
  padding:12px;font-size:9px;color:var(--green);line-height:1.6;
  overflow-x:auto;white-space:pre;max-height:200px;overflow-y:auto;
}
.modal-footer{
  padding:10px 18px;border-top:1px solid var(--border);display:flex;gap:8px;
  flex-shrink:0;background:var(--bg2);
}

/* ── DB MODAL ── */
.modal-code.sql{color:var(--text-mid);}
.kw{color:var(--blue);} .ty{color:var(--amber);} .cm{color:var(--text-dim);font-style:italic;}

/* ── TRANSFORM BADGE (on SVG) ── */
.svg-badge{pointer-events:none;}

/* ── MISC ── */
.dragging-cursor *{cursor:crosshair!important;}
</style>
</head>
<body>

<!-- HEADER -->
<div id="app-header">
  <div class="hdr-brand">≡ AUGMENTED OCR</div>
  <nav class="hdr-nav">
    <div class="hdr-tab" onclick="switchTab(this,'vendors')">VENDORS</div>
    <div class="hdr-tab" onclick="switchTab(this,'templates')">TEMPLATES</div>
    <div class="hdr-tab" onclick="switchTab(this,'extract')">EXTRACT</div>
    <div class="hdr-tab active" onclick="switchTab(this,'mapper')">MAPPER</div>
    <div class="hdr-tab" onclick="switchTab(this,'history')">HISTORY</div>
  </nav>
  <div class="hdr-right">
    <div class="status-dot"></div>
    <span style="font-size:9px;color:var(--text-dim);letter-spacing:0.06em;">AI VISION</span>
    <button class="hdr-btn">LIGHT</button>
  </div>
</div>

<!-- MAIN BODY -->
<div id="app-body">

  <!-- SOURCE JSON PANEL -->
  <div class="panel" id="panel-source">
    <div class="panel-header">
      <span class="panel-title">SOURCE JSON</span>
      <span class="panel-badge">AI VISION OUTPUT</span>
    </div>
    <div class="panel-body" id="json-tree-root"></div>
  </div>

  <!-- CANVAS -->
  <div class="panel" id="panel-canvas">
    <div class="canvas-label" id="canvas-hint">
      <span>⟶</span>
      <div>DRAG FROM SOURCE PORT TO TARGET FIELD</div>
    </div>
  </div>

  <!-- ERP TARGET PANEL -->
  <div class="panel" id="panel-target">
    <div class="panel-header">
      <span class="panel-title">ERP TARGET FIELDS</span>
      <span class="panel-badge">BUSINESS CENTRAL</span>
    </div>
    <div class="panel-body" id="erp-fields-root"></div>
  </div>

</div>

<!-- BOTTOM BAR -->
<div id="bottom-bar">
  <select class="bb-select" id="vendor-select">
    <option value="ferguson">VENDOR: FERGUSON</option>
    <option value="grainger">VENDOR: GRAINGER</option>
    <option value="mcmaster">VENDOR: MCMASTER-CARR</option>
  </select>
  <div class="bb-sep"></div>
  <button class="bb-btn primary" onclick="saveMapping()">SAVE MAPPING</button>
  <button class="bb-btn" onclick="loadMappingUI()">LOAD MAPPING ▾</button>
  <div class="bb-sep"></div>
  <button class="bb-btn" onclick="showExportModal()">EXPORT ERP JSON</button>
  <div class="bb-sep"></div>
  <button class="bb-btn" onclick="showDbSchema()">DB SCHEMA</button>
  <div class="bb-right">
    <button class="bb-btn danger" onclick="clearAll()">CLEAR ALL</button>
  </div>
</div>

<!-- SVG OVERLAY -->
<svg id="svg-overlay" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-blue">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="svg-connections"></g>
  <path id="live-drag-path" class="live-drag" style="display:none;"/>
</svg>

<!-- TOAST -->
<div id="toast"></div>

<!-- CONTEXT MENU -->
<div id="ctx-menu">
  <div class="ctx-title" id="ctx-title">CONNECTION</div>
  <div class="ctx-item ctx-sub">
    <span>⟳</span> Add Transform
    <div class="ctx-sub-menu" id="transform-submenu"></div>
  </div>
  <div class="ctx-item" onclick="setHardcoded()"><span>⊞</span> Set Hardcoded Value</div>
  <div class="ctx-item" onclick="viewJsonpath()"><span>$</span> View JSONPath</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger" onclick="deleteSelectedConnection()"><span>✕</span> Delete Connection</div>
</div>

<!-- EXPORT MODAL -->
<div id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">EXPORT: ERP PAYLOAD</span>
      <button class="modal-close" onclick="closeModal()">✕ CLOSE</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="bb-btn" onclick="copySection('header')">COPY HEADER</button>
      <button class="bb-btn" onclick="copySection('lines')">COPY LINE ITEMS</button>
      <button class="bb-btn primary" onclick="copySection('both')">COPY BOTH</button>
    </div>
  </div>
</div>

<!-- DB SCHEMA MODAL -->
<div id="db-modal" style="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:160;display:none;align-items:center;justify-content:center;">
  <div class="modal" style="width:560px;">
    <div class="modal-header">
      <span class="modal-title">DB SCHEMA — PostgreSQL</span>
      <button class="modal-close" onclick="document.getElementById('db-modal').style.display='none'">✕ CLOSE</button>
    </div>
    <div class="modal-body">
      <pre class="modal-code sql" id="db-schema-content"></pre>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════

const SOURCE_JSON = {
  to: "FRESH PRODUCTS LLC",
  from: "FERGUSON - #1583",
  po_date: "11/18/25",
  po_number: "H1583-6900",
  ship_to: "FERGUSON/WOLSELEY IND #1583",
  line_items: [
    { qty: 6, u_m: "BX", item_code: "FHTF0121072M01", net_price: 13.3 },
    { qty: 12, u_m: "BX", item_code: "FHTF0121072M02", net_price: 13.3 },
    { qty: 3, u_m: "CA", item_code: "PBHEQF0001006M67", net_price: 39.48 }
  ]
};

const ERP_HEADER_FIELDS = [
  { erp: "CustNum",    key: "customer_id",   hint: "customer number" },
  { erp: "Client",     key: "client_name",   hint: "client name" },
  { erp: "CustPo",     key: "po_number",     hint: "purchase order" },
  { erp: "Zip",        key: "zipcode",       hint: "postal code" },
  { erp: "Addr1",      key: "address",       hint: "address line 1" },
  { erp: "ShipToaddr", key: "ship_to_code",  hint: "ship-to address" },
  { erp: "OrderDate",  key: "order_date",    hint: "order date" },
];

const ERP_LINE_FIELDS = [
  { erp: "CustNum",    key: "customer_id",   hint: "customer number", hardcoded: 105240 },
  { erp: "Client",     key: "client_name",   hint: "client name" },
  { erp: "CustPo",     key: "po_number",     hint: "purchase order" },
  { erp: "Line",       key: "line_number",   hint: "auto-increment" },
  { erp: "Item",       key: "item_data.No.", hint: "item number" },
  { erp: "ItemVariant",key: "item_variant",  hint: "item variant" },
  { erp: "CustItem",   key: "item_val",      hint: "customer item" },
  { erp: "QtyOrdered", key: "item_data.Qty.",hint: "quantity" },
  { erp: "Price",      key: "price",         hint: "unit price" },
  { erp: "UM",         key: "um",            hint: "unit of measure" },
  { erp: "DueDate",    key: "due_date",      hint: "due date" },
];

const TRANSFORMS = ["date_format","uppercase","lowercase","trim","concat","substring","number_format"];

// ── Mapping store ──
// { id, source_path, erp_field, section('header'|'line'), transform, hardcoded }
let mappings = [];
let selectedConnectionId = null;
let isDragging = false;
let dragSourcePort = null;
let dragSourcePath = null;

// Port registry: portId → { el, type:'source'|'target', path, erpField, section }
const portRegistry = {};

// ═══════════════════════════════════════════════
// JSON TREE RENDERER
// ═══════════════════════════════════════════════

function renderJsonTree(obj, container, pathPrefix='$', depth=0){
  if(typeof obj === 'object' && obj !== null && !Array.isArray(obj)){
    Object.entries(obj).forEach(([key,val])=>{
      const fullPath = `${pathPrefix}.${key}`;
      const scalar = (typeof val !== 'object' || val === null);
      const isArr = Array.isArray(val);
      const row = document.createElement('div');
      row.className='json-node';
      if(scalar){
        row.innerHTML=`<div class="json-row" data-path="${fullPath}">
          <div class="json-toggle"></div>
          <span class="json-key">${key}</span><span class="json-colon">:</span>
          <span class="${valClass(val)}">${formatVal(val)}</span>
          <div class="port source-port" data-path="${fullPath}" data-key="${key}"></div>
        </div>`;
        container.appendChild(row);
        const port = row.querySelector('.port.source-port');
        registerSourcePort(port, fullPath, key);
      } else {
        const childrenId = 'node-'+Math.random().toString(36).slice(2);
        row.innerHTML=`<div class="json-row">
          <div class="json-toggle open" data-target="${childrenId}">▼</div>
          <span class="json-key">${key}</span><span class="json-colon">:</span>
          <span class="json-type-badge">${isArr?`Array[${val.length}]`:'Object'}</span>
        </div>
        <div class="json-children" id="${childrenId}"></div>`;
        container.appendChild(row);
        const toggleEl = row.querySelector('.json-toggle');
        toggleEl.addEventListener('click',()=>toggleNode(toggleEl));
        renderJsonTree(val, row.querySelector('.json-children'), fullPath, depth+1);
      }
    });
  } else if(Array.isArray(obj)){
    obj.forEach((item,i)=>{
      const fullPath = `${pathPrefix}[${i}]`;
      const childrenId = 'node-'+Math.random().toString(36).slice(2);
      const row = document.createElement('div');
      row.className='json-node';
      if(typeof item === 'object' && item !== null){
        row.innerHTML=`<div class="json-row">
          <div class="json-toggle open" data-target="${childrenId}">▼</div>
          <span class="json-key">[${i}]</span>
          <span class="json-type-badge">Object</span>
        </div>
        <div class="json-children" id="${childrenId}"></div>`;
        container.appendChild(row);
        const toggleEl = row.querySelector('.json-toggle');
        toggleEl.addEventListener('click',()=>toggleNode(toggleEl));
        renderJsonTree(item, row.querySelector('.json-children'), fullPath, depth+1);
      } else {
        row.innerHTML=`<div class="json-row" data-path="${fullPath}">
          <div class="json-toggle"></div>
          <span class="json-key">[${i}]</span><span class="json-colon">:</span>
          <span class="${valClass(item)}">${formatVal(item)}</span>
          <div class="port source-port" data-path="${fullPath}"></div>
        </div>`;
        container.appendChild(row);
        const port = row.querySelector('.port.source-port');
        registerSourcePort(port, fullPath, `[${i}]`);
      }
    });
    // Also add a wildcard port for array fields
    const wildcardPath = pathPrefix.replace(/\[\d+\]$/,'[*]');
  }
}

// Add wildcard ports for line_items array sub-fields
function addWildcardPorts(){
  // For each leaf in line_items[0], add a [*] entry at top level
  const sample = SOURCE_JSON.line_items[0];
  const wildcardSection = document.createElement('div');
  wildcardSection.className='json-node';
  wildcardSection.innerHTML=`<div class="json-row" style="padding:4px 4px;border-top:1px solid var(--border);margin-top:4px;">
    <div class="json-toggle"></div>
    <span style="font-size:9px;color:var(--text-dim);letter-spacing:0.08em;">LINE ITEMS WILDCARDS</span>
  </div>`;
  Object.keys(sample).forEach(k=>{
    const wp = `$.line_items[*].${k}`;
    const r = document.createElement('div');
    r.className='json-node';
    r.innerHTML=`<div class="json-row" data-path="${wp}">
      <div class="json-toggle"></div>
      <span class="json-key" style="color:var(--teal)">[*].${k}</span>
      <span class="json-type-badge">wildcard</span>
      <div class="port source-port" data-path="${wp}" data-key="${k}"></div>
    </div>`;
    wildcardSection.appendChild(r);
    const port = r.querySelector('.port.source-port');
    registerSourcePort(port, wp, `[*].${k}`);
  });
  document.getElementById('json-tree-root').appendChild(wildcardSection);
}

function valClass(v){
  if(typeof v==='string') return 'json-val-str';
  if(typeof v==='number') return 'json-val-num';
  if(v===null) return 'json-val-null';
  return 'json-val-str';
}
function formatVal(v){
  if(typeof v==='string') return `"${v}"`;
  if(v===null) return 'null';
  return String(v);
}
function toggleNode(el){
  const target=document.getElementById(el.dataset.target);
  if(!target) return;
  const open=el.classList.contains('open');
  el.classList.toggle('open',!open);
  el.textContent=open?'▶':'▼';
  target.style.display=open?'none':'';
}

// ═══════════════════════════════════════════════
// ERP FIELDS RENDERER
// ═══════════════════════════════════════════════

function renderErpFields(){
  const root=document.getElementById('erp-fields-root');
  root.innerHTML='';
  renderSection(root,'HEADER',ERP_HEADER_FIELDS,'header');
  renderSection(root,'LINE ITEMS',ERP_LINE_FIELDS,'line');
}

function renderSection(root,label,fields,section){
  const sec=document.createElement('div');
  sec.className='erp-section';
  const childrenId='erp-sec-'+section;
  sec.innerHTML=`<div class="erp-section-header" onclick="toggleSection('${childrenId}',this)">
    <span class="erp-section-toggle open">▶</span>
    <span>${label}</span>
    <span style="margin-left:auto;font-size:8px;color:var(--text-dim)">${fields.length} FIELDS</span>
  </div>
  <div id="${childrenId}"></div>`;
  root.appendChild(sec);
  const container=document.getElementById(childrenId);
  fields.forEach(f=>renderErpField(container,f,section));
}

function renderErpField(container,f,section){
  const fieldId=`erp-${section}-${f.erp}`;
  const mapping = mappings.find(m=>m.erp_field===f.erp && m.section===section);
  const isMapped=!!mapping;
  const row=document.createElement('div');
  row.className='erp-field'+(isMapped?' mapped':'');
  row.id=fieldId+'-row';
  let badge='';
  if(mapping && mapping.hardcoded!=null){
    badge=`<span class="erp-field-hard">${mapping.hardcoded}</span>`;
  } else if(f.hardcoded!=null && !mapping){
    badge=`<span class="erp-field-hard">${f.hardcoded}</span>`;
  } else if(isMapped){
    const shortPath=mapping.source_path.replace('$.line_items[*].','[*].').replace('$.','');
    badge=`<span class="erp-field-mapped" title="${mapping.source_path}">$${shortPath}</span>`;
  } else {
    badge=`<span class="erp-field-empty">— unmapped —</span>`;
  }
  if(mapping && mapping.transform){
    badge+=`<span style="font-size:8px;padding:1px 4px;background:var(--amber-dim);color:var(--amber);border-radius:2px;margin-left:3px;">${mapping.transform}</span>`;
  }
  row.innerHTML=`
    <div class="port target-port${isMapped?' mapped':''}" id="${fieldId}-port" data-erp="${f.erp}" data-section="${section}"></div>
    <span class="erp-field-name">${f.erp}</span>
    <span class="erp-field-key">${f.key}</span>
    ${badge}`;
  container.appendChild(row);
  const port=row.querySelector('.port.target-port');
  registerTargetPort(port, f.erp, section, fieldId);
}

function toggleSection(id,btn){
  const el=document.getElementById(id);
  const tog=btn.querySelector('.erp-section-toggle');
  const open=tog.classList.contains('open');
  tog.classList.toggle('open',!open);
  el.style.display=open?'none':'';
}

// ═══════════════════════════════════════════════
// PORT REGISTRY & DRAG LOGIC
// ═══════════════════════════════════════════════

function registerSourcePort(el, path, key){
  const id='sp-'+path.replace(/[^a-zA-Z0-9]/g,'_');
  el.dataset.portId=id;
  portRegistry[id]={el, type:'source', path, key};
  el.addEventListener('mousedown', e=>{
    e.preventDefault(); e.stopPropagation();
    startDrag(id, e);
  });
  el.addEventListener('mouseenter',()=>el.classList.add('hovered'));
  el.addEventListener('mouseleave',()=>el.classList.remove('hovered'));
}

function registerTargetPort(el, erpField, section, fieldId){
  const id=`tp-${section}-${erpField}`;
  el.dataset.portId=id;
  portRegistry[id]={el, type:'target', erpField, section, fieldId};
  el.addEventListener('mouseenter',()=>{
    if(isDragging){ el.classList.add('valid-target'); }
    else { el.classList.add('hovered'); }
  });
  el.addEventListener('mouseleave',()=>{
    el.classList.remove('valid-target','hovered','invalid-target');
  });
  el.addEventListener('mouseup', e=>{
    if(isDragging){ e.preventDefault(); e.stopPropagation(); finishDrag(id); }
  });
}

function getPortCenter(el){
  const r=el.getBoundingClientRect();
  return { x: r.left+r.width/2, y: r.top+r.height/2 };
}

function startDrag(portId, e){
  isDragging=true;
  dragSourcePort=portId;
  document.body.classList.add('dragging-cursor');
  const livePath=document.getElementById('live-drag-path');
  livePath.style.display='';
  const {x,y}=getPortCenter(portRegistry[portId].el);
  drawLive(x,y,e.clientX,e.clientY);
}

function drawLive(sx,sy,ex,ey){
  const dx=Math.abs(ex-sx)*0.5+80;
  const d=`M ${sx},${sy} C ${sx+dx},${sy} ${ex-dx},${ey} ${ex},${ey}`;
  document.getElementById('live-drag-path').setAttribute('d',d);
}

document.addEventListener('mousemove',e=>{
  if(!isDragging||!dragSourcePort) return;
  const {x,y}=getPortCenter(portRegistry[dragSourcePort].el);
  drawLive(x,y,e.clientX,e.clientY);
});

document.addEventListener('mouseup',e=>{
  if(isDragging){
    isDragging=false;
    document.body.classList.remove('dragging-cursor');
    document.getElementById('live-drag-path').style.display='none';
    dragSourcePort=null;
    // remove valid-target highlights
    document.querySelectorAll('.port.valid-target,.port.invalid-target').forEach(p=>{
      p.classList.remove('valid-target','invalid-target');
    });
  }
});

function finishDrag(targetPortId){
  if(!dragSourcePort) return;
  isDragging=false;
  document.body.classList.remove('dragging-cursor');
  document.getElementById('live-drag-path').style.display='none';

  const src=portRegistry[dragSourcePort];
  const tgt=portRegistry[targetPortId];
  if(!src||!tgt) return;

  // Remove existing mapping on same target
  mappings=mappings.filter(m=>!(m.erp_field===tgt.erpField&&m.section===tgt.section));

  const id='conn-'+Date.now();
  mappings.push({
    id, source_path:src.path, erp_field:tgt.erpField,
    section:tgt.section, transform:null, hardcoded:null
  });

  dragSourcePort=null;
  document.querySelectorAll('.port.valid-target,.port.invalid-target').forEach(p=>p.classList.remove('valid-target','invalid-target'));

  renderErpFields();
  registerAllTargetPorts();
  redrawAllLines();
  hideCanavsHint();
  showToast(`MAPPED: ${src.path} → ${tgt.erpField}`);
}

function registerAllTargetPorts(){
  document.querySelectorAll('.port.target-port').forEach(el=>{
    const id=el.dataset.portId;
    if(id && portRegistry[id]) {
      portRegistry[id].el=el;
      el.addEventListener('mouseenter',()=>{
        if(isDragging){el.classList.add('valid-target');}
        else{el.classList.add('hovered');}
      });
      el.addEventListener('mouseleave',()=>el.classList.remove('valid-target','hovered','invalid-target'));
      el.addEventListener('mouseup',e=>{
        if(isDragging){e.preventDefault();e.stopPropagation();finishDrag(id);}
      });
    }
  });
}

// ═══════════════════════════════════════════════
// SVG CONNECTION DRAWING
// ═══════════════════════════════════════════════

function redrawAllLines(){
  const g=document.getElementById('svg-connections');
  g.innerHTML='';
  mappings.forEach(m=>drawConnection(m,g));
}

function drawConnection(m,g){
  // Find source port
  const srcKey='sp-'+m.source_path.replace(/[^a-zA-Z0-9]/g,'_');
  const tgtKey=`tp-${m.section}-${m.erp_field}`;
  const srcReg=portRegistry[srcKey];
  const tgtReg=portRegistry[tgtKey];
  if(!srcReg||!tgtReg) return;
  // Update el refs
  const srcEl=document.querySelector(`[data-port-id="${srcKey}"]`);
  const tgtEl=document.querySelector(`[data-port-id="${tgtKey}"]`);
  if(!srcEl||!tgtEl) return;
  srcReg.el=srcEl; tgtReg.el=tgtEl;

  const sp=getPortCenter(srcEl);
  const tp=getPortCenter(tgtEl);
  const dx=Math.max(Math.abs(tp.x-sp.x)*0.5, 80);
  const pathD=`M ${sp.x},${sp.y} C ${sp.x+dx},${sp.y} ${tp.x-dx},${tp.y} ${tp.x},${tp.y}`;
  const mid={x:(sp.x+tp.x)/2, y:(sp.y+tp.y)/2};

  const group=document.createElementNS('http://www.w3.org/2000/svg','g');
  group.dataset.connId=m.id;

  // Animated flow line
  const pathEl=document.createElementNS('http://www.w3.org/2000/svg','path');
  pathEl.setAttribute('d',pathD);
  pathEl.setAttribute('stroke','#3b82f6');
  pathEl.setAttribute('stroke-width','1.5');
  pathEl.setAttribute('stroke-dasharray','8 4');
  pathEl.style.animation='dashFlow 1.5s linear infinite';
  pathEl.classList.add('conn-line');
  if(m.id===selectedConnectionId) pathEl.classList.add('selected');

  // Hit area
  const hitEl=document.createElementNS('http://www.w3.org/2000/svg','path');
  hitEl.setAttribute('d',pathD);
  hitEl.classList.add('conn-hit');
  hitEl.style.pointerEvents='stroke';
  hitEl.addEventListener('click',()=>selectConnection(m.id));
  hitEl.addEventListener('contextmenu',e=>{e.preventDefault();selectConnection(m.id);showContextMenu(e,m);});

  group.appendChild(pathEl);
  group.appendChild(hitEl);

  // Transform badge
  if(m.transform){
    const midX=mid.x, midY=mid.y;
    const fo=document.createElementNS('http://www.w3.org/2000/svg','foreignObject');
    fo.setAttribute('x',midX-36); fo.setAttribute('y',midY-10);
    fo.setAttribute('width','72'); fo.setAttribute('height','20');
    fo.innerHTML=`<div xmlns="http://www.w3.org/1999/xhtml" style="background:#f59e0b;color:#000;font-size:8px;padding:2px 5px;border-radius:3px;font-family:monospace;text-align:center;">${m.transform}</div>`;
    group.appendChild(fo);
  }

  g.appendChild(group);
}

function selectConnection(id){
  selectedConnectionId=id;
  redrawAllLines();
}

// ═══════════════════════════════════════════════
// CONTEXT MENU
// ═══════════════════════════════════════════════

function showContextMenu(e,m){
  const menu=document.getElementById('ctx-menu');
  document.getElementById('ctx-title').textContent=`${m.source_path.split('.').pop()} → ${m.erp_field}`;
  // Build transform submenu
  const sub=document.getElementById('transform-submenu');
  sub.innerHTML='';
  TRANSFORMS.forEach(t=>{
    const item=document.createElement('div');
    item.className='ctx-item';
    item.innerHTML=`<span>${t===m.transform?'✓':' '}</span>${t}`;
    item.onclick=()=>{applyTransform(m.id,t);closeContextMenu();};
    sub.appendChild(item);
  });
  menu.style.left=e.clientX+'px';
  menu.style.top=e.clientY+'px';
  menu.classList.add('show');
}

function closeContextMenu(){document.getElementById('ctx-menu').classList.remove('show');}
document.addEventListener('click',()=>closeContextMenu());

function applyTransform(connId, t){
  const m=mappings.find(x=>x.id===connId);
  if(!m) return;
  m.transform = m.transform===t ? null : t;
  renderErpFields(); registerAllTargetPorts(); redrawAllLines();
  showToast(`TRANSFORM: ${t} → ${m.erp_field}`);
}

function setHardcoded(){
  closeContextMenu();
  const m=mappings.find(x=>x.id===selectedConnectionId);
  if(!m) return;
  const v=prompt('Enter hardcoded value:',m.hardcoded||'');
  if(v===null) return;
  m.hardcoded=v?v:null;
  renderErpFields(); registerAllTargetPorts(); redrawAllLines();
}

function viewJsonpath(){
  closeContextMenu();
  const m=mappings.find(x=>x.id===selectedConnectionId);
  if(!m) return;
  showToast(`JSONPath: ${m.source_path}`);
}

function deleteSelectedConnection(){
  closeContextMenu();
  if(!selectedConnectionId) return;
  mappings=mappings.filter(m=>m.id!==selectedConnectionId);
  selectedConnectionId=null;
  renderErpFields(); registerAllTargetPorts(); redrawAllLines();
  showToast('CONNECTION DELETED');
}

// ═══════════════════════════════════════════════
// SAVE / LOAD / CLEAR
// ═══════════════════════════════════════════════

function saveMapping(){
  const vendor=document.getElementById('vendor-select').value;
  const payload={
    id:`map_${vendor}_${Date.now()}`, vendor_id:vendor,
    created_at:new Date().toISOString(), mappings
  };
  const store=JSON.parse(localStorage.getItem('augocr_erp_mappings_v1')||'{}');
  store[vendor]=payload;
  localStorage.setItem('augocr_erp_mappings_v1', JSON.stringify(store));
  const bar=document.getElementById('bottom-bar');
  bar.classList.remove('flash-save');
  void bar.offsetWidth;
  bar.classList.add('flash-save');
  showToast(`MAPPING SAVED — ${vendor.toUpperCase()}`);
}

function loadMappingUI(){
  const store=JSON.parse(localStorage.getItem('augocr_erp_mappings_v1')||'{}');
  const keys=Object.keys(store);
  if(!keys.length){showToast('NO SAVED MAPPINGS');return;}
  const v=keys[0]; // Load first saved
  const saved=store[v];
  mappings=saved.mappings||[];
  renderErpFields(); registerAllTargetPorts(); redrawAllLines();
  showToast(`LOADED: ${v.toUpperCase()}`);
}

function clearAll(){
  if(!mappings.length){showToast('NOTHING TO CLEAR');return;}
  // Fade connections
  document.querySelectorAll('#svg-connections g').forEach(g=>{
    g.style.transition='opacity 0.15s';g.style.opacity='0';
  });
  setTimeout(()=>{
    mappings=[];
    renderErpFields(); registerAllTargetPorts(); redrawAllLines();
    showToast('ALL CONNECTIONS CLEARED');
  },200);
}

// EXPORT MODAL
// ═══════════════════════════════════════════════

function showExportModal(){
  const headerMaps=mappings.filter(m=>m.section==='header');
  const lineMaps=mappings.filter(m=>m.section==='line');

  const headerProps=headerMaps.map(m=>({
    Name:m.erp_field, Value:m.source_path,
    ...(m.transform&&{Transform:m.transform}),
    ...(m.hardcoded!=null&&{HardcodedValue:m.hardcoded})
  }));
  const lineProps=lineMaps.map(m=>({
    Name:m.erp_field, Value:m.source_path||null,
    ...(m.hardcoded!=null&&{HardcodedValue:m.hardcoded})
  }));

  const headerPayload={
    Action:1, ItemId:"PBT=[ue_FP_temp_edi_co]",
    Properties:headerProps
  };
  const linePayload={
    Action:1, ItemId:"PBT=[ue_FP_temp_edi_line]",
    Properties:lineProps
  };

  const body=document.getElementById('modal-body');
  body.innerHTML=`
    <div>
      <div class="modal-section-label">HEADER PAYLOAD</div>
      <pre class="modal-code" id="exp-header">${JSON.stringify(headerPayload,null,2)}</pre>
    </div>
    <div>
      <div class="modal-section-label">LINE ITEM PAYLOAD</div>
      <pre class="modal-code" id="exp-lines">${JSON.stringify(linePayload,null,2)}</pre>
    </div>`;

  // Store for copy buttons
  window._exportHeader=JSON.stringify(headerPayload,null,2);
  window._exportLines=JSON.stringify(linePayload,null,2);

  document.getElementById('modal-overlay').classList.add('show');
}

function closeModal(){document.getElementById('modal-overlay').classList.remove('show');}

function copySection(which){
  let text='';
  if(which==='header') text=window._exportHeader||'';
  else if(which==='lines') text=window._exportLines||'';
  else text=(window._exportHeader||'')+'\n\n'+(window._exportLines||'');
  navigator.clipboard.writeText(text).then(()=>showToast('COPIED TO CLIPBOARD'));
}

// Resize → redraw
let resizeTimer=null;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(redrawAllLines,60);
});

// Scroll → redraw
document.getElementById('panel-source').querySelector('.panel-body').addEventListener('scroll',redrawAllLines);
document.getElementById('panel-target').querySelector('.panel-body').addEventListener('scroll',redrawAllLines);

// ═══════════════════════════════════════════════
// PRE-LOADED DEMO CONNECTIONS
// ═══════════════════════════════════════════════

const DEMO_MAPPINGS = [
  {id:'demo-1', source_path:'$.to',       erp_field:'Client',    section:'header', transform:null, hardcoded:null},
  {id:'demo-2', source_path:'$.po_number',erp_field:'CustPo',    section:'header', transform:null, hardcoded:null},
  {id:'demo-3', source_path:'$.po_date',  erp_field:'OrderDate', section:'header', transform:'date_format', hardcoded:null},
  {id:'demo-4', source_path:'$.line_items[*].qty',       erp_field:'QtyOrdered', section:'line', transform:null, hardcoded:null},
  {id:'demo-5', source_path:'$.line_items[*].item_code', erp_field:'Item',        section:'line', transform:null, hardcoded:null},
];

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════

(function init(){
  // Render JSON tree
  const treeRoot=document.getElementById('json-tree-root');
  renderJsonTree(SOURCE_JSON, treeRoot);
  addWildcardPorts();

  // Render ERP fields (initial — no mappings)
  renderErpFields();

  // Load demo mappings
  mappings=JSON.parse(JSON.stringify(DEMO_MAPPINGS));

  // Re-render ERP with demo mappings applied, register target ports
  renderErpFields();
  registerAllTargetPorts();

  // Draw lines after layout settles
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      redrawAllLines();
      hideCanavsHint();
    });
  });
})();
</script>
