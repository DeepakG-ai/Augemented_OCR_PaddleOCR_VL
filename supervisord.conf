[supervisord]
nodaemon=true
logfile=/workspace/logs/supervisord.log
pidfile=/workspace/supervisord.pid

[unix_http_server]
file=/workspace/supervisor.sock

[supervisorctl]
serverurl=unix:///workspace/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:minio]
command=bash -lc 'exec "${MINIO_BIN:-/workspace/bin/minio}" server /workspace/minio-data --address 127.0.0.1:9000 --console-address 127.0.0.1:9001'
autostart=true
autorestart=true
startretries=5
priority=10
stdout_logfile=/workspace/logs/minio.log
stderr_logfile=/workspace/logs/minio.log

[program:mlflow]
command=bash -lc 'exec "${VENV_DIR:-/workspace/venvs/augocr}/bin/python" -m mlflow server --host 127.0.0.1 --port 5000 --backend-store-uri sqlite:////workspace/mlflow/mlflow.db --default-artifact-root /workspace/mlflow/artifacts'
autostart=true
autorestart=true
startretries=5
priority=20
stdout_logfile=/workspace/logs/mlflow.log
stderr_logfile=/workspace/logs/mlflow.log

[program:llama-server]
command=bash -lc 'export LD_LIBRARY_PATH="${LLAMA_LIB_DIR:-/workspace/llama-server}:$LD_LIBRARY_PATH"; exec "${LLAMA_BIN:-/workspace/llama-server/llama-server}" -m "${MODEL_GGUF}" --mmproj "${MMPROJ_GGUF}" --host "${LLAMA_HOST:-127.0.0.1}" --port "${LLAMA_PORT:-8056}" -ngl "${LLAMA_N_GPU_LAYERS:-99}" -c "${LLAMA_CTX_SIZE:-8192}" -b "${LLAMA_BATCH_SIZE:-4096}" --parallel "${LLAMA_PARALLEL:-1}" --cont-batching --image-min-tokens "${LLAMA_IMAGE_MIN_TOKENS:-1024}" --image-max-tokens "${LLAMA_IMAGE_MAX_TOKENS:-2048}" --cache-ram 0 --reasoning off --jinja'
autostart=true
autorestart=true
startretries=3
startsecs=30
priority=30
stdout_logfile=/workspace/logs/llama.log
stderr_logfile=/workspace/logs/llama.log

[program:api]
command=bash -lc 'until curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; do sleep 2; done; exec "${VENV_DIR:-/workspace/venvs/augocr}/bin/python" -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --no-access-log'
directory=/workspace/app
autostart=true
autorestart=true
startretries=10
priority=50
stdout_logfile=/workspace/logs/api.log
stderr_logfile=/workspace/logs/api.log

[program:pg-backup]
command=bash -lc 'exec bash "${APP_DIR:-/workspace/app}/pg_backup.sh"'
directory=/workspace/app
autostart=true
autorestart=true
startretries=5
priority=55
stdout_logfile=/workspace/logs/pg-backup.log
stderr_logfile=/workspace/logs/pg-backup.log

[program:normalize-1]
command=bash -lc 'exec "${VENV_DIR:-/workspace/venvs/augocr}/bin/python" -m backend.worker --stage normalize --name normalize-1'
directory=/workspace/app
autostart=true
autorestart=true
startretries=10
priority=60
stdout_logfile=/workspace/logs/normalize-1.log
stderr_logfile=/workspace/logs/normalize-1.log

[program:normalize-2]
