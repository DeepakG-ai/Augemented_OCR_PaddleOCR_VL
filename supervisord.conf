[supervisord]
nodaemon=true
logfile=/workspace/logs/supervisord.log
pidfile=/workspace/supervisord.pid

[unix_http_server]
file=/workspace/supervisor.sock

[supervisorctl]
serverurl=unix:///workspace/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:minio]
command=bash -lc 'exec "${MINIO_BIN:-/workspace/bin/minio}" server /workspace/minio-data --address 127.0.0.1:9000 --console-address 127.0.0.1:9001'
autostart=true
autorestart=unexpected
startretries=5
priority=10
stdout_logfile=/workspace/logs/services.log
stderr_logfile=/workspace/logs/services.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; Redis — read cache, localhost-only, in-pod. No persistence (it's a cache):
; --save "" disables RDB snapshots, --appendonly no disables AOF. maxmemory +
; allkeys-lru caps RAM and evicts cold keys so it can never OOM the pod. The app
; fails soft to NullCache if Redis is down, so this is not a hard dependency.
; Requires the redis-server binary: apt-get update && apt-get install -y redis-server
[program:redis]
command=bash -lc 'exec redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru'
autostart=true
autorestart=unexpected
startretries=5
priority=15
stdout_logfile=/workspace/logs/services.log
stderr_logfile=/workspace/logs/services.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:mlflow]
command=bash -lc 'exec "${VENV_DIR:-/workspace/venvs/augocr}/bin/python" -m mlflow server --host 127.0.0.1 --port 5000 --backend-store-uri sqlite:////workspace/mlflow/mlflow.db --default-artifact-root /workspace/mlflow/artifacts'
autostart=true
autorestart=unexpected
startretries=5
priority=20
stdout_logfile=/workspace/logs/services.log
stderr_logfile=/workspace/logs/services.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:llama-server]
command=bash -lc 'export LD_LIBRARY_PATH="${LLAMA_LIB_DIR:-/workspace/llama-server}:$LD_LIBRARY_PATH"; exec "${LLAMA_BIN:-/workspace/llama-server/llama-server}" -m "${MODEL_GGUF}" --alias "${LLM_MODEL:-qwen3.5}" --mmproj "${MMPROJ_GGUF}" --host "${LLAMA_HOST:-127.0.0.1}" --port "${LLAMA_PORT:-8056}" -ngl "${LLAMA_N_GPU_LAYERS:-99}" -c "${LLAMA_CTX_SIZE:-8192}" -b "${LLAMA_BATCH_SIZE:-4096}" --parallel "${LLAMA_PARALLEL:-1}" ${LLAMA_CONT_BATCHING:---cont-batching} --image-min-tokens "${LLAMA_IMAGE_MIN_TOKENS:-1024}" --image-max-tokens "${LLAMA_IMAGE_MAX_TOKENS:-2048}" --cache-ram 0 --reasoning off --jinja'
autostart=true
autorestart=unexpected
startretries=3
startsecs=30
priority=30
stdout_logfile=/workspace/logs/llama.log
stderr_logfile=/workspace/logs/llama.log

[program:api]
command=bash -lc 'until curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; do sleep 2; done; exec "${VENV_DIR:-/workspace/venvs/augocr}/bin/python" -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --no-access-log'
directory=/workspace/app
autostart=true
autorestart=unexpected
startretries=5
priority=50
stdout_logfile=/workspace/logs/api.log
stderr_logfile=/workspace/logs/api.log

; --- Pipeline workers ---
; All workers use autorestart=unexpected so a crash restarts them but a clean
; shutdown (exit 0, e.g. from a SIGTERM during restart) does not loop.
; startretries=3: after 3 consecutive fast failures the worker enters FATAL
; instead of spinning forever. Reduce from 10 to contain crash-restart loops.
;
; Priority ordering: normalize/llm/postprocess (60) start first; OCR workers
; (65) start after — they do a heavy PaddleOCR GPU warmup and starting all
; 6 workers simultaneously caused GPU-init contention and crash loops.

[program:normalize-1]
command=bash -lc 'exec "${VENV_DIR:-/workspace/venvs/augocr}/bin/python" -m backend.worker --stage normalize --name normalize-1'
directory=/workspace/app
autostart=true
autorestart=unexpected
startretries=3
priority=60
stdout_logfile=/workspace/logs/pipeline.log
stderr_logfile=/workspace/logs/pipeline.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:normalize-2]
command=bash -lc 'exec "${VENV_DIR:-/workspace/venvs/augocr}/bin/python" -m backend.worker --stage normalize --name normalize-2'
directory=/workspace/app
autostart=true
autorestart=unexpected
startretries=3
priority=60
stdout_logfile=/workspace/logs/pipeline.log
stderr_logfile=/workspace/logs/pipeline.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:llm-1]
command=bash -lc 'exec "${VENV_DIR:-/workspace/venvs/augocr}/bin/python" -m backend.worker --stage llm --name llm-1'
directory=/workspace/app
autostart=true
autorestart=unexpected
startretries=3
priority=60
stdout_logfile=/workspace/logs/pipeline.log
stderr_logfile=/workspace/logs/pipeline.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:postprocess-1]
command=bash -lc 'exec "${VENV_DIR:-/workspace/venvs/augocr}/bin/python" -m backend.worker --stage postprocess --name post-1'
directory=/workspace/app
autostart=true
autorestart=unexpected
startretries=3
priority=60
stdout_logfile=/workspace/logs/pipeline.log
stderr_logfile=/workspace/logs/pipeline.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; Single OCR worker (OCR_WORKERS=1). A second concurrent OCR process was
; oversubscribing the CPU during PaddleOCR init; one engine is enough and
; warm pages are ~1s each.
[program:ocr-1]
command=bash -lc 'exec "${VENV_DIR:-/workspace/venvs/augocr}/bin/python" -m backend.worker --stage ocr --name ocr-1'
directory=/workspace/app
autostart=true
autorestart=unexpected
startretries=3
; OCR does a heavy PaddleOCR warmup on first start. startsecs=90 ensures a crash
; during warmup counts against startretries (capping retries at 3), not autorestart
; (which has no cap). This prevents a warmup crash from looping forever.
startsecs=90
stopwaitsecs=30
priority=65
stdout_logfile=/workspace/logs/pipeline.log
stderr_logfile=/workspace/logs/pipeline.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
