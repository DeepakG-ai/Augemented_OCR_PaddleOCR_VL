[supervisord]
nodaemon=true
logfile=/workspace/logs/supervisord.log
pidfile=/workspace/supervisord.pid

[unix_http_server]
file=/workspace/supervisor.sock

[supervisorctl]
serverurl=unix:///workspace/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; ── MinIO ──────────────────────────────────────────────────────────────────
[program:minio]
command=/usr/local/bin/minio server /workspace/minio-data
    --address 127.0.0.1:9000
    --console-address 127.0.0.1:9001
autostart=true
autorestart=true
startretries=5
stdout_logfile=/workspace/logs/minio.log
stderr_logfile=/workspace/logs/minio.log

; ── MLflow ─────────────────────────────────────────────────────────────────
[program:mlflow]
command=mlflow server
    --host 127.0.0.1
    --port 5000
    --backend-store-uri sqlite:////workspace/mlflow/mlflow.db
    --default-artifact-root /workspace/mlflow/artifacts
autostart=true
autorestart=true
startretries=5
stdout_logfile=/workspace/logs/mlflow.log
stderr_logfile=/workspace/logs/mlflow.log

; ── llama-server ───────────────────────────────────────────────────────────
[program:llama-server]
command=bash -c 'LD_LIBRARY_PATH=/workspace/llama-server
    /workspace/llama-server/llama-server
    -m %(ENV_MODEL_GGUF)s
    --mmproj %(ENV_MMPROJ_GGUF)s
    --host 127.0.0.1 --port 8056
    -ngl 99 -c 8192 -b 4096
    --parallel %(ENV_LLAMA_PARALLEL)s
    --cont-batching
    --image-min-tokens 1024 --image-max-tokens 2048
    --cache-ram 0 --reasoning off --jinja'
autostart=true
autorestart=true
startretries=3
startsecs=30
stdout_logfile=/workspace/logs/llama.log
stderr_logfile=/workspace/logs/llama.log

; ── API ────────────────────────────────────────────────────────────────────
[program:api]
command=python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --no-access-log
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/workspace/logs/api.log
stderr_logfile=/workspace/logs/api.log

; ── Workers ────────────────────────────────────────────────────────────────
[program:normalize-1]
command=python -m backend.worker --stage normalize --name normalize-1
directory=/app
autostart=true
autorestart=true
startretries=10
stdout_logfile=/workspace/logs/normalize-1.log
stderr_logfile=/workspace/logs/normalize-1.log

[program:normalize-2]
command=python -m backend.worker --stage normalize --name normalize-2
directory=/app
autostart=true
autorestart=true
startretries=10
stdout_logfile=/workspace/logs/normalize-2.log
stderr_logfile=/workspace/logs/normalize-2.log

[program:ocr-1]
command=python -m backend.worker --stage ocr --name ocr-1
directory=/app
autostart=true
autorestart=true
startretries=10
stdout_logfile=/workspace/logs/ocr-1.log
stderr_logfile=/workspace/logs/ocr-1.log

[program:ocr-2]
command=python -m backend.worker --stage ocr --name ocr-2
directory=/app
autostart=true
autorestart=true
startretries=10
stdout_logfile=/workspace/logs/ocr-2.log
stderr_logfile=/workspace/logs/ocr-2.log

[program:llm-1]
command=python -m backend.worker --stage llm --name llm-1
directory=/app
autostart=true
autorestart=true
startretries=10
stdout_logfile=/workspace/logs/llm-1.log
stderr_logfile=/workspace/logs/llm-1.log

[program:postprocess-1]
command=python -m backend.worker --stage postprocess --name post-1
directory=/app
autostart=true
autorestart=true
startretries=10
stdout_logfile=/workspace/logs/post-1.log
stderr_logfile=/workspace/logs/post-1.log
