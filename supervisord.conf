directory=/workspace/app
autostart=true
autorestart=true
startretries=10
priority=60
stdout_logfile=/workspace/logs/ocr-1.log
stderr_logfile=/workspace/logs/ocr-1.log

[program:ocr-2]
command=bash -lc 'exec "${VENV_DIR:-/workspace/venvs/augocr}/bin/python" -m backend.worker --stage ocr --name ocr-2'
directory=/workspace/app
autostart=true
autorestart=true
startretries=10
priority=60
stdout_logfile=/workspace/logs/ocr-2.log
stderr_logfile=/workspace/logs/ocr-2.log

[program:llm-1]
